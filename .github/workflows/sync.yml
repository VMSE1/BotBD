name: Обновить ведомость
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Тесты робота
        run: python -m unittest bot.test_sync
      - name: Собрать ведомость
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SRC_REPO: VMSE1/python
        run: python bot/sync.py
      - name: Сохранить, если что-то изменилось
        run: |
          git config user.name "botbd"
          git config user.email "botbd@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "Без изменений"; else git commit -m "Обновление ведомости"; git push; fi
